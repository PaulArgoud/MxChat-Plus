name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the floor declared in composer.json and in the plugin header
        # (Requires PHP: 8.1). 7.4 / 8.0 were dropped with the merge.
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Lint PHP files
        run: |
          status=0
          for f in $(find . -name '*.php' -not -path './vendor/*' -not -path './mxchat-basic/*' -not -path './tests/_output/*'); do
            php -l "$f" || status=1
          done
          exit $status

  i18n:
    name: i18n catalog check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Validate the POT template
        run: msgfmt --check --statistics languages/mxchat-plus.pot -o /dev/null
      - name: Validate fr_FR.po
        run: msgfmt --check --statistics languages/mxchat-plus-fr_FR.po -o /tmp/check.mo
      - name: The committed .mo must match the .po
        # The zip ships the .mo; a stale one means the French UI silently falls
        # back to English. Compare the compiled output byte-for-byte.
        run: |
          test -f languages/mxchat-plus-fr_FR.mo \
            || { echo '::error::languages/mxchat-plus-fr_FR.mo is missing — run msgfmt and commit it.'; exit 1; }
          cmp languages/mxchat-plus-fr_FR.mo /tmp/check.mo \
            || { echo '::error::The committed .mo is out of date — re-run: msgfmt languages/mxchat-plus-fr_FR.po -o languages/mxchat-plus-fr_FR.mo'; exit 1; }
      - name: Single text domain
        # 'mxchat-plus' is the only domain this plugin may use. Host-plugin
        # symbols (mxchat_*) are untouched, but a stray 'mxchat-duckdb' /
        # 'mxchat-promptcache' domain would lose its translations silently.
        run: |
          if grep -rn --include='*.php' -E "'(mxchat-duckdb|mxchat-promptcache)'" includes admin *.php 2>/dev/null; then
            echo '::error::A legacy text domain survived the merge — everything must use mxchat-plus.'
            exit 1
          fi

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - name: Install dependencies (with dev — needed for phpstan-wordpress stubs)
        run: composer install --no-progress --prefer-dist --no-interaction
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction
      - name: Run tests
        run: vendor/bin/phpunit --testdox

  audit:
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Audit production dependencies
        # The release zip ships only production deps; dev advisories (phpunit /
        # phpstan) don't reach end users — so we audit the production set only.
        # This plugin currently has ZERO runtime deps, which makes `composer
        # audit` exit non-zero with "No installed packages found". So: install
        # prod deps, then treat the empty-set case as a pass while still failing
        # on a genuine advisory once a prod dep is added. Note there is no
        # `|| true` on the install itself — a broken install must fail the job.
        run: |
          composer install --no-dev --no-progress --prefer-dist --no-interaction
          set +e
          out=$(composer audit --no-dev --abandoned=report 2>&1); code=$?
          set -e
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] && exit 0
          printf '%s\n' "$out" | grep -qi 'no installed packages' \
            && { echo '::notice::No production dependencies to audit — OK.'; exit 0; }
          exit "$code"
